name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 has no build for the newest Ubuntu runner image, so it runs on Ubuntu 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Self-test
        run: PYTHONPATH=src python -m genotype_checks selftest

  wdl:
    # Checks the draft workflow's syntax and types, and its test inputs against it. Nothing is run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: miniwdl check
        run: |
          python -m pip install --disable-pip-version-check "miniwdl==1.16.0"
          miniwdl check workflows/genotype_checks.wdl
      - name: womtool validate
        run: |
          curl --fail --silent --show-error --location --output womtool.jar \
            https://github.com/broadinstitute/cromwell/releases/download/92/womtool-92.jar
          echo "99cd3675c48696470f4d4e8b397fc613d7b342eb2ef2fa96f86db114bd9ed5f8  womtool.jar" | sha256sum --check
          java -jar womtool.jar validate --inputs workflows/test.json workflows/genotype_checks.wdl
